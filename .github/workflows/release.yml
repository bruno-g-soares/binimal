name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tagName = $env:TAG_NAME
          $version = $tagName.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag does not contain a valid version: $tagName"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Binimal.sln

      - name: Build
        run: dotnet build Binimal.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Binimal.sln --configuration Release --no-build

      - name: Exercise native Recycle Bin query
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "src/Binimal.App/bin/Release/net481/Binimal.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Binimal native self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package portable release
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src/Binimal.App/bin/Release/net481/Binimal.exe" "dist/Binimal.exe"
          $archive = "dist/Binimal-$env:TAG_NAME-win.zip"
          Compress-Archive -Path "dist/Binimal.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -NoNewline "$archive.sha256"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$env:TAG_NAME" dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "Binimal $env:TAG_NAME"
